spring:
  application:
    name: money-trail-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/money_trail}
    username: ${DB_USERNAME:money_trail}
    password: ${DB_PASSWORD:money_trail}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
